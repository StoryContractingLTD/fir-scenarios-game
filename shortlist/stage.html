<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Who's Left Standing?</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script src="config.js"></script>
<script src="content/game.js"></script>
<style>
  :root { --blue:#0061ad; --blue-dark:#004e8c; --blue-pale:#e9f1f9; --ink:#2b2f33; --grey:#60666d; --line:#dee0e1; --amber:#f2a900; --amber-pale:#fff6dd; --green:#1f9d57; --green-pale:#e3f6ea; --white:#ffffff; }
  * { box-sizing:border-box; }
  html, body { height:100%; margin:0; background:#dfe4ea; overflow:hidden; }
  body { font-family:Arial, Helvetica, sans-serif; color:var(--ink); display:flex; align-items:center; justify-content:center; }
  h1, h2, .eyebrow, .pill, .L, .pts, .tag, button, .nm, .bubble-who, .jlab, .score { font-family:'Montserrat', Arial, sans-serif; }
  #stage { position:relative; width:min(100vw, calc(100vh * 16 / 9)); aspect-ratio:16 / 9; container-type:inline-size; overflow:hidden; background:var(--white); display:flex; flex-direction:column; }
  .bar { flex:0 0 auto; background:var(--blue); height:6cqw; display:flex; align-items:center; justify-content:space-between; padding:0 3cqw 0 0; }
  .bar img { height:100%; }
  .bar span { color:#cfe2f3; font-family:'Montserrat', Arial, sans-serif; font-weight:700; font-size:1.2cqw; letter-spacing:.25cqw; text-transform:uppercase; }
  #panel { flex:1; min-height:0; display:flex; flex-direction:column; padding:1.8cqw 3cqw 1.8cqw; }
  section { display:none; flex:1; flex-direction:column; min-height:0; }
  section.on { display:flex; }
  .center { align-items:center; justify-content:center; text-align:center; }
  .eyebrow { font-weight:700; text-transform:uppercase; letter-spacing:.25cqw; font-size:1.05cqw; color:var(--blue); margin:0 0 .6cqw; }
  .muted { color:var(--grey); }
  .big-head { font-size:2.6cqw; font-weight:800; color:var(--blue); margin:0 0 1cqw; line-height:1.1; }

  /* Join */
  #v-join { flex-direction:row; align-items:center; gap:4cqw; }
  .join-left { flex:1; }
  .game-title { font-size:5.4cqw; font-weight:800; color:var(--blue); margin:0 0 1.2cqw; line-height:1; }
  .game-sub { font-size:1.8cqw; line-height:1.45; margin:0; max-width:44cqw; }
  .join-right { display:flex; flex-direction:column; align-items:center; text-align:center; }
  .qr-card { background:#fff; border:.3cqw solid var(--blue); border-radius:1.4cqw; padding:1cqw; }
  #qr { width:19cqw; height:19cqw; }
  #qr img, #qr canvas { width:100% !important; height:100% !important; }
  .join-title { font-family:'Montserrat', Arial, sans-serif; font-size:1.7cqw; font-weight:700; color:var(--ink); margin:1.4cqw 0 .3cqw; }
  .join-url { font-size:.95cqw; color:var(--grey); margin:0; word-break:break-all; max-width:26cqw; }
  .join-count { margin-top:1.2cqw; font-family:'Montserrat', Arial, sans-serif; font-size:1.7cqw; font-weight:700; color:var(--blue); }

  /* Board view: left panel + job strip + 12 cards */
  #v-board { flex-direction:row; gap:2cqw; }
  .lp { flex:0 0 31cqw; display:flex; flex-direction:column; min-height:0; }
  .rp { flex:1; display:flex; flex-direction:column; min-width:0; min-height:0; }
  .lp-top { display:flex; align-items:center; justify-content:space-between; gap:1cqw; min-height:2.6cqw; }
  .pill { font-size:1cqw; font-weight:800; text-transform:uppercase; letter-spacing:.12cqw; padding:.45cqw 1.1cqw; border-radius:99cqw; background:var(--line); color:var(--grey); white-space:nowrap; }
  .pill.open { background:var(--blue); color:#fff; }
  .pill.hide { display:none; }
  #countdown { width:4.6cqw; height:4.6cqw; border-radius:50%; border:.35cqw solid var(--blue); display:none; align-items:center; justify-content:center; font-family:'Montserrat', Arial, sans-serif; font-size:1.8cqw; font-weight:800; color:var(--blue); flex:0 0 auto; }
  #countdown.on { display:flex; }
  #countdown.hurry { border-color:var(--amber); color:#a86f00; }

  .jobstrip { display:flex; flex-wrap:wrap; gap:.5cqw; align-items:center; margin:0 0 1cqw; }
  .jlab { font-size:1cqw; font-weight:800; color:var(--blue); text-transform:uppercase; letter-spacing:.12cqw; margin-right:.4cqw; }
  .jchip { font-size:.92cqw; background:var(--blue-pale); color:var(--blue-dark); padding:.35cqw .8cqw; border-radius:99cqw; font-weight:700; border:.15cqw solid transparent; transition:all .4s; }
  .jchip.lit { background:var(--amber-pale); border-color:var(--amber); color:#7a5000; box-shadow:0 0 0 .2cqw rgba(242,169,0,.25); }

  /* The board: a Story-blue plastic tray with two tiers of flip tiles */
  .tray { flex:1; min-height:0; position:relative; border-radius:1.4cqw; padding:1cqw 1.1cqw .4cqw;
    background:linear-gradient(180deg, #1b78c4 0%, #0061ad 45%, #004e8c 100%);
    box-shadow:inset 0 .2cqw 0 rgba(255,255,255,.35), inset 0 -.35cqw 0 rgba(0,0,0,.25), 0 .8cqw 1.6cqw rgba(0,40,80,.28);
    display:grid; grid-template-columns:repeat(6, 1fr); grid-template-rows:1fr 1fr; column-gap:0; row-gap:.9cqw; }
  .slot { position:relative; perspective:42cqw; perspective-origin:50% -40%; }
  .ledge { position:absolute; left:0; right:0; bottom:0; height:1.5cqw; border-radius:.3cqw;
    background:linear-gradient(180deg, #4a9be0 0%, #1a73bd 30%, #00508f 100%);
    box-shadow:inset 0 .12cqw 0 rgba(255,255,255,.5), 0 .3cqw .5cqw rgba(0,30,60,.35); }
  .slot:first-child .ledge, .slot:nth-child(7) .ledge { border-top-left-radius:.6cqw; border-bottom-left-radius:.6cqw; }
  .slot:nth-child(6) .ledge, .slot:last-child .ledge { border-top-right-radius:.6cqw; border-bottom-right-radius:.6cqw; }
  .tile { position:absolute; left:.4cqw; right:.4cqw; top:0; bottom:1.05cqw; transform-origin:50% 100%;
    transition:transform .85s cubic-bezier(.45,.05,.3,1.25); }
  .frame { position:absolute; inset:0; border-radius:.75cqw; padding:.42cqw .42cqw .55cqw;
    background:linear-gradient(180deg, #5aa8ea 0%, #1f80cf 18%, #0a6ab8 55%, #00579c 100%);
    box-shadow:inset 0 .16cqw 0 rgba(255,255,255,.6), inset .14cqw 0 0 rgba(255,255,255,.22), inset -.14cqw 0 0 rgba(0,0,0,.18), inset 0 -.22cqw 0 rgba(0,0,0,.28), 0 .45cqw .7cqw rgba(0,25,55,.4);
    transition:box-shadow .4s, filter .6s; }
  .frame::after { content:""; position:absolute; top:.25cqw; bottom:.25cqw; left:12%; width:22%; border-radius:.6cqw; pointer-events:none;
    background:linear-gradient(90deg, rgba(255,255,255,0), rgba(255,255,255,.22), rgba(255,255,255,0)); }
  .card { position:relative; height:100%; border-radius:.38cqw; overflow:hidden; display:flex; flex-direction:column; background:#fff;
    box-shadow:inset 0 0 0 .13cqw #003a69; transition:filter .6s, opacity .6s; }
  .art { flex:0 0 auto; aspect-ratio:1 / 1; position:relative; border-bottom:.13cqw solid #003a69;
    background:radial-gradient(circle at 50% 30%, #ffffff 0%, #e4effa 70%), #e4effa; }
  .art::before { content:""; position:absolute; inset:0; opacity:.5;
    background-image:radial-gradient(circle, #c4dcf2 .12cqw, transparent .14cqw); background-size:.9cqw .9cqw; }
  .art svg { position:relative; width:100%; height:100%; display:block; }
  .plate { flex:0 0 auto; text-align:center; font-family:'Montserrat', Arial, sans-serif; font-weight:800; font-size:1.05cqw; letter-spacing:.06cqw; color:#003a69; padding:.25cqw .2cqw .15cqw; text-transform:uppercase; }
  .info { flex:1; min-height:0; padding:0 .35cqw .3cqw; text-align:center; }
  .info .ln { font-size:.86cqw; font-weight:700; color:var(--blue-dark); line-height:1.2; }
  .info .ps { font-size:.78cqw; color:var(--grey); line-height:1.22; margin-top:.2cqw; }
  .cover { position:absolute; inset:0; border-radius:.75cqw; opacity:0; transition:opacity .15s; pointer-events:none;
    background:repeating-linear-gradient(0deg, rgba(255,255,255,.07) 0 .25cqw, rgba(0,0,0,.05) .25cqw .5cqw), linear-gradient(180deg, #2a86d1, #00579c);
    display:flex; align-items:center; justify-content:center; font-family:'Montserrat', Arial, sans-serif; font-style:italic; font-weight:800; font-size:2cqw; color:rgba(255,255,255,.35); }
  .score { position:absolute; left:50%; bottom:-.35cqw; width:2.3cqw; height:2.3cqw; margin-left:-1.15cqw; border-radius:50%; z-index:3;
    background:#fff; color:var(--blue); border:.22cqw solid var(--blue); font-family:'Montserrat', Arial, sans-serif; font-size:1.15cqw; font-weight:800;
    display:flex; align-items:center; justify-content:center; opacity:0; transform:scale(.3); transition:all .5s; box-shadow:0 .2cqw .5cqw rgba(0,30,60,.35); }
  .slot.show-score .score { opacity:1; transform:scale(1); }

  /* States */
  .slot.down .tile { transform:rotateX(78deg); }
  .slot.down .cover { opacity:1; transition-delay:.3s; }
  .slot.hot .frame { box-shadow:inset 0 .16cqw 0 rgba(255,255,255,.6), 0 0 0 .3cqw #f2a900, 0 0 1.4cqw .3cqw rgba(242,169,0,.75); animation:hot 1.4s ease-in-out infinite; }
  @keyframes hot { 50% { box-shadow:inset 0 .16cqw 0 rgba(255,255,255,.6), 0 0 0 .3cqw #f2a900, 0 0 2.2cqw .6cqw rgba(242,169,0,.45); } }
  .slot.out .frame { filter:saturate(.15) brightness(1.15); }
  .slot.out .card { filter:grayscale(1); opacity:.6; }
  .slot.out .score { border-color:#8a9097; color:#60666d; }
  .slot.lit .frame { box-shadow:inset 0 .16cqw 0 rgba(255,255,255,.6), 0 0 0 .3cqw var(--green), 0 0 1.4cqw .3cqw rgba(31,157,87,.55); }
  .slot.lit .score { background:var(--green); border-color:var(--green); color:#fff; }
  @media (prefers-reduced-motion: reduce) { .tile, .score, .cover { transition:none; } .slot.hot .frame { animation:none; } }

  /* Left panel pieces */
  .bubble { position:relative; background:var(--blue); color:#fff; border-radius:1.2cqw; padding:1.1cqw 1.3cqw; margin:.6cqw 0 1.1cqw; }
  .bubble::after { content:""; position:absolute; left:2.4cqw; bottom:-1.1cqw; border:.6cqw solid transparent; border-top:.6cqw solid var(--blue); border-left:.6cqw solid var(--blue); }
  .bubble-who { font-size:.9cqw; font-weight:800; text-transform:uppercase; letter-spacing:.12cqw; color:#cfe2f3; margin:0 0 .35cqw; }
  .bubble-text { font-size:1.55cqw; font-weight:700; line-height:1.3; margin:0; }
  .opts { display:flex; flex-direction:column; gap:.6cqw; }
  .opt { display:flex; align-items:flex-start; gap:.8cqw; border:.18cqw solid var(--line); border-radius:.9cqw; padding:.7cqw .9cqw; font-size:1.2cqw; font-weight:700; line-height:1.25; background:#fff; }
  .L { flex:0 0 auto; width:2.3cqw; height:2.3cqw; border-radius:50%; background:var(--blue); color:#fff; display:flex; align-items:center; justify-content:center; font-weight:800; font-size:1.2cqw; }
  .lp-foot { margin-top:auto; padding-top:.8cqw; font-family:'Montserrat', Arial, sans-serif; font-size:1.25cqw; font-weight:700; color:var(--blue); }
  .lp-text { font-size:1.45cqw; line-height:1.45; margin:0 0 1cqw; }
  .lp-big { font-family:'Montserrat', Arial, sans-serif; font-size:2.3cqw; font-weight:800; color:var(--ink); line-height:1.2; margin:0 0 1cqw; }
  .stat { display:flex; gap:.8cqw; margin:0 0 1.1cqw; }
  .stat div { flex:1; background:var(--blue-pale); border-radius:.9cqw; padding:.8cqw .6cqw; text-align:center; font-size:1cqw; font-weight:700; color:var(--blue-dark); }
  .stat b { display:block; font-family:'Montserrat', Arial, sans-serif; font-size:2.6cqw; color:var(--blue); line-height:1.05; }
  .stat div.warn { background:var(--amber-pale); color:#7a5000; } .stat div.warn b { color:#a86f00; }

  /* Reveal rows */
  .decision { background:var(--ink); color:#fff; border-radius:.9cqw; padding:.7cqw 1cqw; font-size:1.2cqw; line-height:1.35; margin:.4cqw 0 .8cqw; }
  .decision b { font-family:'Montserrat', Arial, sans-serif; }
  .rv-row { display:flex; gap:.8cqw; align-items:flex-start; border:.18cqw solid var(--line); border-radius:.9cqw; padding:.6cqw .8cqw; }
  .rv-row.best { border-color:var(--amber); background:var(--amber-pale); }
  .rv-row.best .L { background:var(--amber); color:#3b2a00; }
  .rv-row.picked { box-shadow:inset .35cqw 0 0 var(--ink); }
  .rv-mid { flex:1; min-width:0; }
  .rv-title { font-family:'Montserrat', Arial, sans-serif; font-size:1.05cqw; font-weight:800; margin:0 0 .2cqw; line-height:1.25; }
  .rv-why { font-size:.95cqw; line-height:1.3; margin:0; color:var(--ink); }
  .rv-right { flex:0 0 5.4cqw; text-align:right; }
  .pts { font-size:1.6cqw; font-weight:800; color:var(--blue); line-height:1; }
  .rv-row.best .pts { color:#a86f00; }
  .votes { font-family:'Montserrat', Arial, sans-serif; font-size:.9cqw; font-weight:700; color:var(--grey); margin-top:.2cqw; }
  .tag { display:inline-block; background:var(--amber); color:#3b2a00; font-size:.75cqw; font-weight:800; text-transform:uppercase; letter-spacing:.08cqw; padding:.15cqw .55cqw; border-radius:99cqw; margin-left:.4cqw; vertical-align:middle; }
  .reveal-line { margin-top:auto; padding-top:.8cqw; font-size:1.2cqw; line-height:1.4; border-left:.4cqw solid var(--blue); padding-left:.9cqw; }
  .names { font-size:1.25cqw; line-height:1.6; margin:0 0 1cqw; }
  .names b { font-family:'Montserrat', Arial, sans-serif; color:var(--ink); }
  .tagline { font-family:'Montserrat', Arial, sans-serif; font-size:2.6cqw; font-weight:800; color:var(--green); line-height:1.15; margin-top:auto; }

  /* Final scores */
  .board { display:grid; grid-auto-flow:column; grid-template-rows:repeat(5, auto); gap:.8cqw 2cqw; width:70cqw; margin:0 auto; text-align:left; }
  .board.one-col { grid-auto-flow:row; width:44cqw; }
  .brow { display:flex; align-items:center; gap:1cqw; background:var(--blue-pale); border-radius:.8cqw; padding:.8cqw 1.2cqw; font-size:1.8cqw; font-weight:700; }
  .brow .rank { color:var(--blue); width:2.4cqw; font-family:'Montserrat', Arial, sans-serif; }
  .brow .bn { flex:1; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .brow .p { font-family:'Montserrat', Arial, sans-serif; color:var(--blue); font-weight:800; }
  .brow.lead { background:var(--amber-pale); box-shadow:0 0 0 .2cqw var(--amber); }
  #winNames { font-family:'Montserrat', Arial, sans-serif; font-size:3.6cqw; font-weight:800; color:var(--blue); line-height:1.15; margin:0 0 1.6cqw; }

  /* Start overlay */
  #start { position:fixed; inset:0; background:var(--blue); display:flex; flex-direction:column; align-items:center; justify-content:center; z-index:10; }
  #start img { width:min(50vw, 700px); }
  #start button { margin-top:4vh; font-size:clamp(18px, 2.2vw, 32px); font-weight:800; padding:1.1vw 3vw; border-radius:999px; border:none; background:#fff; color:var(--blue); cursor:pointer; }
  #start p { color:#cfe2f3; font-size:clamp(13px, 1.1vw, 18px); margin-top:2vh; }
  .hide { display:none !important; }
</style>
</head>
<body>
  <div id="stage">
    <div class="bar"><img id="barLogo" alt="Story"><span>Fairness, Inclusion and Respect</span></div>
    <div id="panel">
      <section id="v-waiting" class="on center"><p class="muted" style="font-size:2cqw">Waiting for the control screen to connect...</p></section>

      <section id="v-join">
        <div class="join-left">
          <p class="eyebrow">Shortlisting activity</p>
          <h1 class="game-title" id="gameTitle"></h1>
          <p class="muted game-sub" id="gameSub"></p>
        </div>
        <div class="join-right">
          <div class="qr-card"><div id="qr"></div></div>
          <p class="join-title">Scan to join: one phone per table</p>
          <p class="join-url" id="joinUrl"></p>
          <p class="join-count" id="joinCount"></p>
        </div>
      </section>

      <section id="v-board">
        <div class="lp">
          <div class="lp-top"><p class="eyebrow" id="lpEyebrow" style="margin:0"></p><span class="pill hide" id="lpPill"></span><div id="countdown"></div></div>
          <div id="lpBody" style="display:flex;flex-direction:column;flex:1;min-height:0"></div>
        </div>
        <div class="rp">
          <div class="jobstrip" id="jobstrip"></div>
          <div class="tray" id="grid"></div>
        </div>
      </section>

      <section id="v-winner" class="center">
        <p class="eyebrow">Final scores</p>
        <h1 class="big-head" id="winHead"></h1>
        <p id="winNames"></p>
        <div class="board" id="board"></div>
      </section>
    </div>
  </div>

  <div id="start">
    <img id="startLogo" alt="Story">
    <button id="startBtn">Click to start</button>
    <p>Drag this window onto the projector first. This click turns the sound on and goes full screen.</p>
  </div>

<script>
  var C = window.SL_CONFIG, G = window.SL_GAME, S = C.sounds;
  var IMG = C.assets + 'images/', AUD = C.assets + 'audio/';
  var el = function (id) { return document.getElementById(id); };
  el('gameTitle').textContent = G.title;
  el('gameSub').textContent = G.subtitle;
  el('barLogo').src = IMG + C.images.logo;
  el('startLogo').src = IMG + C.images.logo;
  function esc(t) { return String(t).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
  var byId = {}; G.applicants.forEach(function (a) { byId[a.id] = a; });
  function first(id) { return byId[id].name.split(' ')[0]; }
  function listNames(ids) {
    var n = ids.map(first);
    if (n.length < 2) return n.join('');
    return n.slice(0, -1).join(', ') + ' and ' + n[n.length - 1];
  }
  function pts(r, L) { return L === r.best ? 10 : 5; }

  // ---- Faces: illustrated portraits, drawn in code (no image files needed) ----
  function shade(hex, amt) {
    var n = parseInt(hex.slice(1), 16), r = n >> 16, g = (n >> 8) & 255, b = n & 255;
    function f(c) { return Math.max(0, Math.min(255, Math.round(amt < 0 ? c * (1 + amt) : c + (255 - c) * amt))); }
    return '#' + ((1 << 24) + (f(r) << 16) + (f(g) << 8) + f(b)).toString(16).slice(1);
  }
  function avatar(a, i) {
    var k = a.look, f = a.sex === 'f', id = 'av' + i, s = '';
    var sk = k.skin, skD = shade(sk, -0.2), skDD = shade(sk, -0.38), skL = shade(sk, 0.22);
    var h = k.hair, hD = shade(h, -0.35), hL = shade(h, 0.3);
    var top = k.top || '#4a5568', topD = shade(top, -0.3), topL = shade(top, 0.18), eye = k.eyes || '#5a3b22';
    var HR = 'url(#' + id + 'hr)', SK = 'url(#' + id + 'sk)';
    s += '<svg viewBox="0 0 100 100" aria-hidden="true"><defs>' +
      '<radialGradient id="' + id + 'sk" cx="44%" cy="36%" r="68%"><stop offset="0" stop-color="' + skL + '"/><stop offset=".65" stop-color="' + sk + '"/><stop offset="1" stop-color="' + skD + '"/></radialGradient>' +
      '<linearGradient id="' + id + 'hr" x1="0" y1="0" x2=".3" y2="1"><stop offset="0" stop-color="' + hL + '"/><stop offset=".55" stop-color="' + h + '"/><stop offset="1" stop-color="' + hD + '"/></linearGradient>' +
      '<linearGradient id="' + id + 'tp" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="' + topL + '"/><stop offset="1" stop-color="' + topD + '"/></linearGradient>' +
      '<clipPath id="' + id + 'c"><rect x="0" y="0" width="100" height="100"/></clipPath></defs><g clip-path="url(#' + id + 'c)">';

    // Hair behind the head
    if (k.style === 'long') s += '<path d="M27,36 C20,58 21,84 25,106 L75,106 C79,84 80,58 73,36 Z" fill="' + hD + '"/>';
    if (k.style === 'bob') s += '<path d="M27,38 C23,54 24,68 28,75 L72,75 C76,68 77,54 73,38 Z" fill="' + hD + '"/>';
    if (k.style === 'curly') [[24,60],[76,60],[26,70],[74,70]].forEach(function (c) { s += '<circle cx="' + c[0] + '" cy="' + c[1] + '" r="7" fill="' + hD + '"/>'; });

    }

    else if (st.phase === 'f-spec') {
      el('lpEyebrow').textContent = 'The final reveal';
      body = '<p class="lp-big">The shortlist the job card picks</p>' +
        '<p class="names">' + SPEC_TOP.map(function (id) { return '<b>' + esc(byId[id].name) + '</b> ' + byId[id].score; }).join('<br>') + '</p>' +
        '<p class="tagline">' + esc(G.final.tagline) + '</p>';
      var s4 = {}; G.applicants.forEach(function (a) { s4[a.id] = SPEC_TOP.indexOf(a.id) > -1 ? 'lit' : 'out'; });
      setBoard(s4, true);
    }

    el('lpBody').innerHTML = body;
  }

  function drawBoard(scores) {
    var list = (scores || []).slice(0, 10);
    var b = el('board');
    b.classList.toggle('one-col', list.length <= 5);
    var top = list.length ? list[0].score : 0;
    var rank = 0, prev = null;
    b.innerHTML = list.map(function (x, i) {
      if (x.score !== prev) { rank = i + 1; prev = x.score; }
      return '<div class="brow' + (x.score === top ? ' lead' : '') + '"><span class="rank">' + rank + '</span><span class="bn">' +
        esc(x.name) + '</span><span class="p">' + x.score + '</span></div>';
    }).join('') || '<p class="muted" style="font-size:1.6cqw">No tables joined.</p>';
  }

  // ---- Messages from the control screen ----
  var lastMsgAt = 0;
  window.addEventListener('message', function (e) {
    var m = e.data || {};
    if (m.type !== 'display' || !m.state) return;
    lastMsgAt = Date.now();
    var st = m.state; current = st;
    if (st.musicOn !== undefined && st.musicOn !== musicOn) { musicOn = st.musicOn; applyMusic(); }
    render(st);
    if (st.cue && st.cue.id !== lastCue) {
      lastCue = st.cue.id;
      if (started && Date.now() - st.cue.at < 4000) playCue(st);
    }
  });

  el('startBtn').addEventListener('click', function () {
    started = true;
    el('start').classList.add('hide');
    try { actx = actx || new (window.AudioContext || window.webkitAudioContext)(); actx.resume(); } catch (e) {}
    try { if (document.documentElement.requestFullscreen) document.documentElement.requestFullscreen().catch(function () {}); } catch (e) {}
  });

  function sayReady() { if (window.opener) { try { window.opener.postMessage({ type: 'stage-ready' }, '*'); } catch (e) {} } }
  sayReady();
  setInterval(function () { if (Date.now() - lastMsgAt > 3000) sayReady(); }, 3000);
</script>
</body>
</html>
